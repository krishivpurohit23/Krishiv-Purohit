<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Quiet web — a Spider-Verse-inspired welcome</title>
  <desc id="desc">Ah, a visitor! You're welcome, I guess. Breaking things, fixing them, and occasionally calling it progress. Everything is a work in progress — including this introduction. Silver corner webs, drifting crimson-to-violet waves, and a hanging neon spider.</desc>

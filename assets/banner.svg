    <filter id="waveGlow" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="neon" x="-100%" y="-70%" width="300%" height="240%" color-interpolation-filters="sRGB">

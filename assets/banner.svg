      <feDropShadow dx="3" dy="0" stdDeviation="1.8" flood-color="#ff00a0" flood-opacity=".95"/>
    </filter>
    <clipPath id="frame"><path d="M0 0H1200V300H0Z"/></clipPath>
    <path id="waveShape" d="M-100 225 C100 185 300 185 500 225 S900 265 1300 210 V320H-100Z">
